name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Java 11, like the Plugin Hub's build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Build and test
        run: ./gradlew build --console=plain
