plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.osrsaibuddy.OsrsAiBuddyPluginTest'

// Game updates ship a new RuneLite release; don't keep an outdated client cached for a day.
configurations.configureEach {
	resolutionStrategy.cacheDynamicVersionsFor 10, 'minutes'
}

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.osrsaibuddy'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// CI's log is all there is of a failed test there: print each failure in full, with its message and stack trace.
test {
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea", "-Xmx768m", "-Xss2m"
	// Same as the launcher's clientJvm17MacArguments (static.runelite.net/bootstrap.json)
	if (System.getProperty('os.name').toLowerCase().contains('mac')) {
		jvmArgs "--add-opens=java.base/java.net=ALL-UNNAMED",
			"--add-opens=java.base/java.io=ALL-UNNAMED",
			"--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED"
	}
	args "--developer-mode", "--debug"
}


version = '1.0.0'

// Binary redistributions must include the inherited BSD license and attribution.
tasks.named('jar') {
    from(files('LICENSE', 'NOTICE.md')) { into 'META-INF' }
}

